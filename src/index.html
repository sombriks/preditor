<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Preditor - pre tag editor</title>
        <style>
        html, body, #app {
          margin: 0;
          padding: 0;
        }

        body {
            overflow: auto;
        }
        </style>
        <script type="module" src="./App.vue"></script>
        <script type="module">
          import '@owickstrom/the-monospace-web/src/reset.css'
          import '@owickstrom/the-monospace-web/src/index.css'
          import {createApp} from 'vue'
          import App from './App.vue'

          window.addEventListener('DOMContentLoaded', () => {
            createApp(App)
              .mount('#app')
          })
        </script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
